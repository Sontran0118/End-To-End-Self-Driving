# Bit-banged SWD from the Jetson Orin Nano's 40-pin header.
# No ST-Link, no USB-UART, no DFU -- three wires and openocd's linuxgpiod driver.
#
# Wiring (Jetson 40-pin -> FK407M1 SWD/Serial header):
#   pin 18  PY.03  line 125  -> DIO  (PA13, SWDIO)
#   pin 16  PY.04  line 126  -> CLK  (PA14, SWCLK)
#   pin 22  PY.01  line 123  -> RST  (NRST)
#   pin 20         GND       -> GND
# Power the F407 from its own USB. Do NOT tie 3V3/5V between the boards.
#
# Line offsets come from Jetson.GPIO's own board map for JETSON_ORIN_NANO, so
# they are the authoritative numbers rather than a guess from a pinout diagram.

adapter driver linuxgpiod
# openocd 0.12 takes the gpiochip per-signal via -chip, not as a global setting.
adapter gpio swdio  125 -chip 0
adapter gpio swclk  126 -chip 0
adapter gpio srst   123 -chip 0

reset_config srst_only srst_nogate

transport select swd
# Bit-banging is slow and jitter-prone; start low. Raise only if it is reliable.
adapter speed 100

source [find target/stm32f4x.cfg]
