# Bit-banged SWD from the Jetson Orin Nano's 40-pin header -> FK407M1 (STM32F407VET6).
#
# WHY THESE PINS AND NOT 16/18:
# The original config used header pins 18/16 = lines 125/126 = PY.03/PY.04.
# Those pads are SPI3_CS0/SPI3_CS1:
#
#   pin 125 (SPI3_CS0_PY3): (MUX UNCLAIMED) (GPIO UNCLAIMED)
#   pin 126 (SPI3_CS1_PY4): (MUX UNCLAIMED) (GPIO UNCLAIMED)
#
# "MUX UNCLAIMED" means no driver claimed the mux, so the pad keeps its
# boot-time device-tree function -- SPI3, not GPIO. gpioset then reports the
# line as "out hi" while the pad drives nothing at all. Measured: driving
# line 126 high left the far end at 0 V, and a pin16<->pin18 loopback showed
# no transfer in either direction. Silent failure, no error anywhere.
#
# These pins are dedicated GPIO pads instead (SOC_GPIOxx in the pinmux table):
#   pin 29  line 105  PQ.05  SOC_GPIO32  -> DIO  (PA13, SWDIO)
#   pin 31  line 106  PQ.06  SOC_GPIO33  -> CLK  (PA14, SWCLK)
#   pin  7  line 144  PAC.06 SOC_GPIO59  -> RST  (NRST)   [optional]
#   pin 30 or 34      GND                -> GND
#
# Power the F407 from its own USB-C. Do NOT tie 3V3/5V between the boards.
# Line offsets come from Jetson.GPIO's board map for JETSON_ORIN_NANO.

adapter driver linuxgpiod
# openocd 0.12 takes the gpiochip per-signal via -chip, not as a global setting.
adapter gpio swdio 105 -chip 0
adapter gpio swclk 106 -chip 0

# NRST is not wired for the first attempt; the F407 leaves PA13/PA14 in their
# SWD reset function, so connect-under-reset is not needed. If firmware ever
# reclaims those pins, wire pin 7 and switch to srst_only/srst_nogate below.
reset_config none separate

transport select swd
# Bit-banging over gpiod is not rate-configurable; openocd warns and free-runs.
adapter speed 100

source [find target/stm32f4x.cfg]
